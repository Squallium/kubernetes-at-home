image:
  tag: 0.6.27

volumeMounts:
  - name: config
    mountPath: /config
  - name: books
    mountPath: /books

volumes:
  - name: config
    persistentVolumeClaim:
      claimName: calibre-web-config

  - name: books
    hostPath:
      path: /mnt/services/media/books
      type: Directory

ingress:
  hosts:
    - host: calibre-web-dev.internal
      paths:
        - path: /
          pathType: Prefix

storage:
  enabled: true
  provisioner:
    enabled: false

  persistentVolumeClaims:
    - name: calibre-web-config
      size: 1Gi