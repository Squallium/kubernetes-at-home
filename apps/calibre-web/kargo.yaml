chart:
  targetRevision: 1.0.11
kargo:
  warehouse:
    image:
      imageSelectionStrategy: Lexical
      repoURL: docker.io/linuxserver/calibre-web
      constraint: ''
      allowTagsRegexes:
        - '^0\.\d+\.\d+$'
      ignoreTagsRegexes:
        - '.*-b\.\d+$'
        - 'nightly.*$'
        - 'latest'
        - 'dev-.*'
        - 'version-.*$'
        - 'amd64-.*$'
      discoveryLimit: 15
    chart:
      repoURL: https://squallium.github.io/kubernetes-at-home
      name: servarr