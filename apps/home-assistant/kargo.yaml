chart:
  targetRevision: 1.0.6
kargo:
  warehouse:
    image:
      repoURL: ghcr.io/home-assistant/home-assistant
      discoveryLimit: 7
      constraint: ''
      allowTagsRegexes:
        - ''
      ignoreTagsRegexes: []
    chart:
      repoURL: https://pajikos.github.io/home-assistant-helm-chart
      name: home-assistant
  stages:
    dev:
      enabled: true
      color: green
      configColor: yellow
      onlyConfig: false
      relPath: /development
      argoCDAppSuffix: -development
    pro:
      enabled: true
      color: red
      configColor: black
      onlyConfig: false
      relPath: /production
      argoCDAppSuffix: -production
    lelo:
      enabled: true
      color: "#2e66a6"
      configColor: blue
      onlyConfig: false
      relPath: /lelo
      argoCDAppSuffix: -lelo
      requestedFreightDirect: false
  config:
    enabled: true
    warehouse:
      chart:
        name: home-assistant-config
      images:
        mosquitto:
          repoURL: docker.io/eclipse-mosquitto
          discoveryLimit: 7
          semverConstraint: ''
          allowTagsRegexes:
            - ''
          ignoreTagsRegexes: []
extSecrets:
  - name: github-ssh
    namespace: home-assistant
    labels:
      kargo.akuity.io/cred-type: git
    secrets:
      - secretKey: repoURL
        remoteRef:
          key: secret/kargo/github
          property: repo_url
      - secretKey: sshPrivateKey
        remoteRef:
          key: secret/kargo/github
          property: ssh_private_key