chart:
  targetRevision: 1.0.11
kargo:
  project:
    global: true
  warehouse:
    chart:
      repoURL: https://prometheus-community.github.io/helm-charts
      name: kube-prometheus-stack
  stages:
    dev:
      enabled: true
    pro:
      enabled: true
      color: red
      configColor: "#a42ea6"
      onlyConfig: false
      relPath: /production
      argoCDAppSuffix: -production
    lelo:
      enabled: true
      color: orange
      configColor: "#a42ea6"
      onlyConfig: false
      relPath: /lelo
      argoCDAppSuffix: -lelo
    core:
      enabled: true
    pro-v2:
      enabled: true