chart:
  targetRevision: 1.0.11
kargo:
  project:
    global: true
  warehouse:
    chart:
      repoURL: https://prometheus-community.github.io/helm-charts
      name: kube-prometheus-stack
  stages:
    dev:
      enabled: true
    pro:
      enabled: true
    core:
      enabled: true
    pro-v2:
      enabled: true
      color: "#74a5f2"
      onlyConfig: false
      relPath: /pro-v2
      argoCDAppSuffix: -pro-v2