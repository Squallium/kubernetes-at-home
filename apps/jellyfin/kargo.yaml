chart:
  targetRevision: 1.0.11
kargo:
  warehouse:
    image:
      repoURL: docker.io/jellyfin/jellyfin
      discoveryLimit: 7
      constraint: ''
      allowTagsRegexes:
        - '^\d+\.\d+\.\d+$'
        - '^\d+\.\d+$'
      ignoreTagsRegexes: []
      strictSemvers: 'false'
    chart:
      repoURL: https://jellyfin.github.io/jellyfin-helm
      name: jellyfin
