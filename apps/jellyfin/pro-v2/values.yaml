image:
  tag: 10.11.8
ingress:
  enabled: true
  className: public
  hosts:
    - host: jellyfin.internal
      paths:
        - path: /
          pathType: ImplementationSpecific

persistence:
  config:
    size: 10Gi
  media:
    enabled: true
    type: hostPath
    hostPath: /mnt/services/media
  cache:
    enabled: true
    type: pvc
    size: 10Gi