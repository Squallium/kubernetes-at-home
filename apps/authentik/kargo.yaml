chart:
  targetRevision: 1.0.9
kargo:
  warehouse:
    image:
      repoURL: ghcr.io/goauthentik/server
      discoveryLimit: 7
      constraint: ''
      allowTagsRegexes:
        - '^\d+\.\d+\.\d+$'
    chart:
      repoURL: https://charts.goauthentik.io
      name: authentik
  config:
    enabled: true
    warehouse:
      chart:
        name: authentik-config
  promotionTasks:
    imageVersion:
      tagKey: global.image.tag