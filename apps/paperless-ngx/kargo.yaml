chart:
  targetRevision: 1.0.11
kargo:
  warehouse:
    image:
      repoURL: docker.io/paperlessngx/paperless-ngx
      constraint: ^2.16.3
      allowTagsRegexes:
        - '^\d+\.\d+\.\d+$'
      ignoreTagsRegexes:
        - '.*-b\.\d+$'
        - 'nightly.*$'
        - 'latest'
        - 'dev'
        - 'version-.*$'
        - 'amd64-.*$'
      discoveryLimit: 15
    chart:
      repoURL: https://squallium.github.io/kubernetes-at-home
      name: paperless-ngx
