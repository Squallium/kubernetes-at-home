chart:
  targetRevision: 1.0.4
kargo:
  warehouse:
    image:
      repoURL: ghcr.io/immich-app/immich-server
      discoveryLimit: 7
      constraint: ''
      allowTagsRegexes:
        - '^v\d+\.\d+\.\d+$'
      ignoreTagsRegexes: []
    chart:
      repoURL: https://squallium.github.io/kubernetes-at-home
      name: immich
  promotionTasks:
    repoURL: git@github.com:Squallium/kubernetes-at-home.git
extSecrets:
  - name: github-ssh
    namespace: immich
    labels:
      kargo.akuity.io/cred-type: git
    secrets:
      - secretKey: repoURL
        remoteRef:
          key: secret/kargo/github
          property: repo_url
      - secretKey: sshPrivateKey
        remoteRef:
          key: secret/kargo/github
          property: ssh_private_key