apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
data:
  VIKUNJA_SERVICE_PUBLICURL: {{ .Values.publicUrl | quote }}
  VIKUNJA_DATABASE_TYPE: postgres
  VIKUNJA_DATABASE_HOST: vikunja-postgres
  VIKUNJA_DATABASE_USER: vikunja
  VIKUNJA_DATABASE_PASSWORD: vikunja
  VIKUNJA_DATABASE_DATABASE: vikunja
  VIKUNJA_SERVICE_SECRET: {{ .Values.secret }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config-file
data:
  config.yml: |
{{- if .Values.auth.openid.enabled }}
    auth:
      openid:
        enabled: true
        providers:
          - name: {{ default "authentik" .Values.auth.openid.providerName }}
            authurl: {{ .Values.auth.openid.authurl }}
            clientid: {{ .Values.auth.openid.client_id }}
            clientsecret: {{ .Values.auth.openid.client_secret }}
            scope: openid profile email
            forceuserinfo: false
{{- end }}
