{{- $defaults := .Values.defaults }}
{{- $backups := mergeOverwrite
    (deepCopy (.Values.backups | default dict))
    (.Values.additionalBackups | default dict)
    (.Values.infrastructureBackups | default dict)
}}
{{- range $name, $backup := $backups }}
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  paused: {{ $backup.paused | default $defaults.paused }}
  schedule: {{ $backup.schedule | quote }}
  useOwnerReferencesInBackup: {{ $defaults.useOwnerReferencesInBackup }}
  template:
    csiSnapshotTimeout: {{ $defaults.csiSnapshotTimeout }}
    defaultVolumesToFsBackup: {{ $defaults.defaultVolumesToFsBackup }}
    includedNamespaces:
      - {{ $backup.namespace | quote }}
    ttl: {{ $backup.ttl | default $defaults.ttl | quote }}
    uploaderConfig:
      parallelFilesUpload: {{ $defaults.parallelFilesUpload }}
{{- end }}