certAuthoritySecret:
  enable: false
  name: "home-internal-ca"
certIssuer:
  enable: false
  name: "home-internal-ca-issuer"
certificates: []
letsEncrypt:
  enable: false
  issuerName: letsencrypt-stagging
  server: https://acme-staging-v02.api.letsencrypt.org/directory
  email: example@gmail.com
  domain: domain.com
  cloudFlare:
    apiTokenSecretPath: secret/cert-manager/development/cloudflare
  reflector:
    enable: false