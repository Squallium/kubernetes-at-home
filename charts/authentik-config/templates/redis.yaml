apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
spec:
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redisdata
              mountPath: /data
          {{- if .Values.redis.secretName }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: password
          command: [ "sh", "-c" ]
          args:
            - redis-server --requirepass "$REDIS_PASSWORD"
          {{- end }}
          {{- include "chart.resources" (dict "name" "redis" "Values" .Values) | nindent 10 }}
      volumes:
        - name: redisdata
          persistentVolumeClaim:
            claimName: authentik-redis-pvc
---
{{- if eq (.Values.redis.storageType | default "hostPath") "hostPath" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-redis-pv
spec:
  capacity:
    storage: {{ .Values.redis.storage | default "512Mi" }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: {{ .Values.redis.storagePath }}
    type: DirectoryOrCreate
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  {{- if eq (.Values.redis.storageType | default "hostPath") "hostPath" }}
  storageClassName: manual
  {{- else }}
  storageClassName: openebs-hostpath
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.storage | default "512Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
spec:
  selector:
    app: authentik-redis
  ports:
    - protocol: TCP
      port: 6379
