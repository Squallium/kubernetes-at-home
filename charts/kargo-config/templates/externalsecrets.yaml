{{- range $extSecret := .Values.extSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-{{ $extSecret.name }}
  namespace: {{ $extSecret.namespace | default "kargo" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: kargo-{{ $extSecret.name }}
    creationPolicy: Owner
    template:
      metadata:
        annotations: {}
        {{- if $extSecret.labels }}
        labels:
          {{- if $extSecret.labels }}
          {{- range $key, $value := $extSecret.labels }}
          {{ $key }}: {{ $value }}
          {{- end }}
          {{- end }}
        {{- end }}
      type: {{ $extSecret.templateType | default "Opaque" }}
  data:
    {{- range $secret := $extSecret.secrets }}
    - secretKey: {{ $secret.secretKey }}
      remoteRef:
        key: {{ $secret.remoteRef.key }}
        property: {{ $secret.remoteRef.property | default $secret.secretKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
---
{{- end }}
{{- range $sharedSecret := .Values.sharedSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $sharedSecret.name }}
  namespace: kargo-shared-resources
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: {{ $sharedSecret.name }}
    creationPolicy: Owner
    template:
      metadata:
        annotations: {}
        {{- if $sharedSecret.labels }}
        labels:
          {{- if $sharedSecret.labels }}
            {{- range $key, $value := $sharedSecret.labels }}
            {{ $key }}: {{ $value }}
            {{- end }}
            {{- end }}
        {{- end }}
      type: {{ $sharedSecret.templateType | default "Opaque" }}
  data:
    {{- range $secret := $sharedSecret.secrets }}
    - secretKey: {{ $secret.secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $secret.remoteRef.key }}
        metadataPolicy: None
        property: {{ $secret.remoteRef.property | default $secret.secretKey }}
    {{- end }}
---
{{- end }}